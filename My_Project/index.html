<html>

    <head>

        <style>
            .formDiv{
                background-color: antiquewhite;
                border-radius: 20px;
                box-shadow: 10px 10px 6px grey;
                border: 1px solid black;
                width: 400px;
                padding: 20px;
                margin: 40px;
            }

            .inputFields{
                border-radius: 8px ;
                padding: 8px;
            }
            button:hover{
                color: white;
                background-color: blue;
            }
        </style>

    </head>

    <body>
        <div class="formDiv">
            <form id="formId">
                <label>Enter the UserName</label>
                <br>
                <input type="text" placeholder="Enter Username" class="inputFields">
                <br><br>
                <label>Enter the Password</label>
                <br>
                <input type="password" placeholder="Enter Username" class="inputFields">
                <br><br>
                <button type="submit" class="inputFields">Submit</button>
            </form>

        </div>
    </body>
</html>
